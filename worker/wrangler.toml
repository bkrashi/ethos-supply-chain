# ETHOS backend (Cloudflare Worker). Deploy:  npx wrangler deploy  (from this folder)
# Secrets are set with `wrangler secret put NAME` and never committed:
#   SAYARI_CLIENT_ID, SAYARI_CLIENT_SECRET, ANTHROPIC_API_KEY, ACCESS_CODE
name = "ethos-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://bkrashi.github.io,http://localhost:8000"
CASE_URL = "https://bkrashi.github.io/ethos-supply-chain/data/case-tfm.json"
MODEL = "claude-opus-5-5"

# Per-IP rate limits (Cloudflare Workers rate limiting binding)
[[ratelimits]]
name = "SEARCH_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "COUNCIL_LIMIT"
namespace_id = "1002"
simple = { limit = 2, period = 60 }
